<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">casting-director demo preview</title>
  <desc id="desc">A wide net of developer feeds is screened into a short ranked shortlist of people worth a conversation, each with a hook and a score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <mask id="hc"><circle cx="18" cy="18" r="11.5" fill="#fff"/><path d="M17 18 L31 10 L31 26 Z" fill="#000"/></mask>
    <mask id="hd"><rect x="25" y="5" width="26" height="26" fill="#fff"/></mask>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1055" cy="120" r="210" fill="#ffd400" opacity="0.18"/>
  <circle cx="120" cy="650" r="180" fill="#38bdf8" opacity="0.13"/>

  <!-- header -->
  <g transform="translate(70 66)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(-0.06 -12.06) scale(0.895)">
      <g transform="translate(26 19) scale(0.82) translate(-26 -18)">
        <circle cx="18" cy="18" r="11.5" fill="#ffd400" mask="url(#hc)"/>
        <circle cx="34" cy="18" r="11.5" fill="#ffd400" mask="url(#hd)"/>
        <polygon points="26,25.5 17,30 35,30" fill="#ffd400"/>
      </g>
      <rect x="9" y="28" width="38" height="20" rx="4" fill="#ffd400"/>
      <polygon points="47,32 60,28 60,46 47,42" fill="#ffd400"/>
    </g>
    <text x="66" y="14" fill="#ffffff" font-size="40" font-weight="700">casting-director</text>
    <text x="66" y="45" fill="#cbd5e1" font-size="21">Cast a wide net, screen for taste, ship a ranked shortlist</text>
  </g>

  <!-- left card: the wide net -->
  <g transform="translate(70 168)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="430" height="486" rx="24" fill="#ffffff"/>
    <rect width="430" height="70" rx="24" fill="#111111"/>
    <rect y="46" width="430" height="24" fill="#111111"/>
    <text x="30" y="45" fill="#ffd400" font-size="23" font-weight="700">The wide net</text>
    <text x="400" y="44" fill="#94a3b8" font-size="15" text-anchor="end">Sourcing</text>

    <g>
      <circle cx="46" cy="120" r="7" fill="#ff6600"/>
      <text x="70" y="126" fill="#111827" font-size="17" font-weight="700">Hacker News</text>
      <rect x="300" y="110" width="98" height="24" rx="6" fill="#f4f4f5"/>
      <text x="349" y="127" fill="#64748b" font-size="13" text-anchor="middle">412 items</text>

      <circle cx="46" cy="172" r="7" fill="#111111"/>
      <text x="70" y="178" fill="#111827" font-size="17" font-weight="700">GitHub Trending</text>
      <rect x="300" y="162" width="98" height="24" rx="6" fill="#f4f4f5"/>
      <text x="349" y="179" fill="#64748b" font-size="13" text-anchor="middle">318 items</text>

      <circle cx="46" cy="224" r="7" fill="#ff4500"/>
      <text x="70" y="230" fill="#111827" font-size="17" font-weight="700">Reddit</text>
      <rect x="300" y="214" width="98" height="24" rx="6" fill="#f4f4f5"/>
      <text x="349" y="231" fill="#64748b" font-size="13" text-anchor="middle">256 items</text>

      <circle cx="46" cy="276" r="7" fill="#da552f"/>
      <text x="70" y="282" fill="#111827" font-size="17" font-weight="700">Product Hunt</text>
      <rect x="300" y="266" width="98" height="24" rx="6" fill="#f4f4f5"/>
      <text x="349" y="283" fill="#64748b" font-size="13" text-anchor="middle">154 items</text>

      <circle cx="46" cy="328" r="7" fill="#38bdf8"/>
      <text x="70" y="334" fill="#111827" font-size="17" font-weight="700">Show HN, more</text>
      <rect x="300" y="318" width="98" height="24" rx="6" fill="#f4f4f5"/>
      <text x="349" y="335" fill="#64748b" font-size="13" text-anchor="middle">100 items</text>
    </g>

    <rect x="30" y="374" width="370" height="82" rx="14" fill="#111111"/>
    <text x="52" y="408" fill="#ffffff" font-size="16">1,240 candidates</text>
    <text x="52" y="434" fill="#94a3b8" font-size="14">screened against your rubric</text>
    <text x="378" y="425" fill="#ffd400" font-size="34" font-weight="700" text-anchor="end">&#8595;</text>
  </g>

  <!-- right card: the shortlist -->
  <g transform="translate(560 148)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="570" height="506" rx="18" fill="#ffffff"/>
    <rect width="570" height="56" rx="18" fill="#111111"/>
    <rect y="38" width="570" height="18" fill="#111111"/>
    <text x="26" y="36" fill="#ffffff" font-size="22" font-weight="700">THE SHORTLIST</text>
    <rect x="470" y="14" width="82" height="28" rx="6" fill="#ffd400"/>
    <text x="511" y="33" fill="#111111" font-size="13" font-weight="700" text-anchor="middle">WEEK 31</text>

    <text x="26" y="88" fill="#64748b" font-size="15">Five people worth a conversation, not a link dump</text>

    <!-- entry 1 -->
    <g transform="translate(0 108)">
      <circle cx="52" cy="34" r="22" fill="#ffd400"/>
      <text x="52" y="42" fill="#111111" font-size="22" font-weight="700" text-anchor="middle">1</text>
      <text x="90" y="28" fill="#111111" font-size="20" font-weight="700">@vec-witch</text>
      <text x="90" y="54" fill="#475569" font-size="15">Rebuilt a vector DB in a weekend, for fun</text>
      <rect x="470" y="14" width="76" height="40" rx="10" fill="#111111"/>
      <text x="508" y="40" fill="#ffd400" font-size="20" font-weight="700" text-anchor="middle">92</text>
    </g>
    <line x1="26" y1="206" x2="544" y2="206" stroke="#e5e7eb" stroke-width="1"/>

    <!-- entry 2 -->
    <g transform="translate(0 214)">
      <circle cx="52" cy="34" r="22" fill="#ffd400"/>
      <text x="52" y="42" fill="#111111" font-size="22" font-weight="700" text-anchor="middle">2</text>
      <text x="90" y="28" fill="#111111" font-size="20" font-weight="700">ffmpeg-gui maintainer</text>
      <text x="90" y="54" fill="#475569" font-size="15">Left big tech to make video tools accessible</text>
      <rect x="470" y="14" width="76" height="40" rx="10" fill="#111111"/>
      <text x="508" y="40" fill="#ffd400" font-size="20" font-weight="700" text-anchor="middle">88</text>
    </g>
    <line x1="26" y1="312" x2="544" y2="312" stroke="#e5e7eb" stroke-width="1"/>

    <!-- entry 3 -->
    <g transform="translate(0 320)">
      <circle cx="52" cy="34" r="22" fill="#ffd400"/>
      <text x="52" y="42" fill="#111111" font-size="22" font-weight="700" text-anchor="middle">3</text>
      <text x="90" y="28" fill="#111111" font-size="20" font-weight="700">@type-goblin</text>
      <text x="90" y="54" fill="#475569" font-size="15">Ships a typed language, teaches it on stream</text>
      <rect x="470" y="14" width="76" height="40" rx="10" fill="#111111"/>
      <text x="508" y="40" fill="#ffd400" font-size="20" font-weight="700" text-anchor="middle">85</text>
    </g>

    <rect x="26" y="446" width="518" height="42" rx="10" fill="#fef9e6"/>
    <text x="46" y="472" fill="#111111" font-size="14">Each entry ships a hook, a why-now, and how to reach them.</text>
  </g>
</svg>
